name: videobot-v7

# O workflow nao contem mais canais nem nichos. Ele consulta config/canais.yml
# e abre um job separado apenas para os canais que estao no horario.
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      canal:
        description: "ID do canal ou 'todos'"
        type: string
        default: "todos"
      teste:
        description: "Gerar sem publicar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: videobot-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  planejar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.matriz.outputs.valor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml tzdata
      - id: matriz
        env:
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && inputs.canal || '' }}
        run: |
          if [ -n "$FORCAR" ]; then
            VALOR="$(python videobot.py devidos --json --forcar "$FORCAR")"
          else
            VALOR="$(python videobot.py devidos --json)"
          fi
          echo "valor=$VALOR" >> "$GITHUB_OUTPUT"
          echo "$VALOR"

  gerar-e-postar:
    needs: planejar
    if: ${{ needs.planejar.outputs.matriz != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.planejar.outputs.matriz) }}

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar ffmpeg
        if: ${{ matrix.modo == 'gerar' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Baixar o renderizador
        if: ${{ matrix.modo == 'gerar' }}
        env:
          MPT_REF: ${{ vars.MPT_REF }}
        run: |
          REF="${MPT_REF:-5dde46390809edba44c2e8d09760623bb846fd9d}"
          git init MoneyPrinterTurbo
          git -C MoneyPrinterTurbo remote add origin https://github.com/harry0703/MoneyPrinterTurbo.git
          git -C MoneyPrinterTurbo fetch --depth 1 origin "$REF"
          git -C MoneyPrinterTurbo checkout --detach FETCH_HEAD
          cp MoneyPrinterTurbo/config.example.toml MoneyPrinterTurbo/config.toml

      - name: Instalar dependencias
        run: |
          python -m pip install -q --upgrade pip wheel
          pip install -q -r requirements.txt

      - name: Montar configuracao do renderizador
        if: ${{ matrix.modo == 'gerar' }}
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          COVERR_KEY: ${{ secrets.COVERR_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python - <<'PY'
          import os, re, sys
          p = "MoneyPrinterTurbo/config.toml"
          s = open(p, encoding="utf-8").read()

          def setar(chave, valor, texto):
              padrao = rf'^{re.escape(chave)}\s*=.*$'
              if not re.search(padrao, texto, flags=re.M):
                  sys.exit(f"chave '{chave}' sumiu do config.example.toml")
              return re.sub(padrao, f'{chave} = {valor}', texto, count=1, flags=re.M)

          pex = os.environ.get("PEXELS_KEY", "")
          gem = os.environ.get("GEMINI_KEY", "")
          if not pex or not gem:
              sys.exit("Faltam PEXELS_KEY e/ou GEMINI_KEY")
          modelo = os.environ.get("GEMINI_MODEL") or "gemini-flash-latest"
          s = setar("video_source", '"pexels"', s)
          s = setar("subtitle_provider", '"edge"', s)
          s = setar("pexels_api_keys", f'["{pex}"]', s)
          s = setar("llm_provider", '"gemini"', s)
          s = setar("gemini_api_key", f'"{gem}"', s)
          s = setar("gemini_model_name", f'"{modelo}"', s)

          fontes = ["pexels"]
          if os.environ.get("PIXABAY_KEY"):
              s = setar("pixabay_api_keys", f'["{os.environ["PIXABAY_KEY"]}"]', s)
              fontes.append("pixabay")
          if os.environ.get("COVERR_KEY"):
              s = setar("coverr_api_keys", f'["{os.environ["COVERR_KEY"]}"]', s)
              fontes.append("coverr")
          open(p, "w", encoding="utf-8").write(s)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("FONTES=" + ",".join(fontes) + "\n")
          PY

      - name: Gerar e publicar
        env:
          YOUTUBE_TOKEN: ${{ secrets[format('YOUTUBE_TOKEN_{0}', matrix.segredo)] || secrets.YOUTUBE_TOKEN }}
          IG_USER_ID: ${{ secrets[format('IG_USER_ID_{0}', matrix.segredo)] || secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets[format('IG_TOKEN_{0}', matrix.segredo)] || secrets.IG_TOKEN }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          TIKTOK_TOKEN: ${{ secrets[format('TIKTOK_TOKEN_{0}', matrix.segredo)] || secrets.TIKTOK_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ vars.TIKTOK_REDIRECT_URI }}
          TIKTOK_DIRECT_POST: ${{ vars.TIKTOK_DIRECT_POST }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          DRIVE_CREDENTIALS: ${{ secrets.DRIVE_CREDENTIALS }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIDEOBOT_PERMITE_CREDENCIAL_GERAL: ${{ matrix.permite_geral }}
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.teste }}" = "true" ]; then EXTRA="--teste"; fi
          python videobot.py rodar --canal "${{ matrix.canal }}" --slot "${{ matrix.slot }}" $EXTRA

      - name: Guardar video de teste
        if: ${{ always() && github.event.inputs.teste == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.canal }}-${{ github.run_number }}
          path: |
            MoneyPrinterTurbo/storage/tasks/*/final-1*.mp4
            dados/${{ matrix.canal }}/downloads/*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Salvar estado do canal
        if: always()
        run: |
          git config user.name "videobot"
          git config user.email "videobot@users.noreply.github.com"
          git add temas.txt 2>/dev/null || true
          git add dados/.temas_atualizados 2>/dev/null || true
          git add "dados/${{ matrix.canal }}/agenda.json" 2>/dev/null || true
          git add "dados/${{ matrix.canal }}/usados.txt" 2>/dev/null || true
          git add "dados/${{ matrix.canal }}/drive_usados.txt" 2>/dev/null || true
          git add "dados/${{ matrix.canal }}/historico.jsonl" 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "videobot[${{ matrix.canal }}]: atualizar estado"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash
          done
          exit 1
